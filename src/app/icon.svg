<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="InvitePremium">
  <!--
    El icono del sitio: un sobre de invitación, en la paleta de la marca.

    Se juzga a 16 píxeles, no en el editor, y eso decide el dibujo entero. Un monograma en
    Cormorant —que es como se escribe la marca— a ese tamaño es una mancha: las astas finas
    de una romana desaparecen antes que la forma. Un sobre no: se reconoce por silueta, y
    además dice qué se vende aquí.

    Por el mismo motivo el sobre va **relleno** de papel y no perfilado en oro. Un trazo de
    2 sobre 64 son 0,5 píxeles a tamaño de pestaña, o sea nada; el oro se queda en el borde
    y en el sello, que son detalle, y la legibilidad la sostiene el contraste papel/tinta.

    Sin variante para tema oscuro a propósito: el fondo es la tinta de la marca, que ya
    contrasta contra las dos barras de pestañas.
  -->
  <rect width="64" height="64" rx="14" fill="#2b2723" />

  <!-- El papel. Es lo único que se ve a 16 px, así que ocupa lo que puede sin tocar el borde. -->
  <rect x="12" y="19" width="40" height="27" rx="3" fill="#f6f1e9" stroke="#c19b4a" stroke-width="2" />

  <!-- La solapa: la uve que convierte un rectángulo en un sobre. -->
  <path
    d="M13.5 21.5 L32 34 L50.5 21.5"
    fill="none"
    stroke="#2b2723"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!--
    El sello de lacre, en oro profundo.

    Empezó en r=4.5 centrado en y=41 y a 16 píxeles era una mancha parda sobre el papel:
    con la solapa encima, el sobre se leía sucio en vez de leerse cerrado. Bajado al borde
    inferior y reducido, a 16 se funde con la línea del papel —que es lo que tiene que
    pasar— y a 32 y a 180 vuelve a ser un sello, que es lo que separa este sobre del icono
    de correo de cualquier otra aplicación.
  -->
  <circle cx="32" cy="43" r="3.5" fill="#a8823a" />
</svg>
