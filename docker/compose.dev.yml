name: invitepremium-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: invite
      POSTGRES_PASSWORD: invite
      POSTGRES_DB: invite
    ports:
      - '5434:5432'
    volumes:
      - invite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U invite -d invite']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  invite_pgdata:
